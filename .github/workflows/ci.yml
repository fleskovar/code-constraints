name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + typecheck + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"

      - name: Tests (pytest)
        run: python -m pytest -q

      # Advisory, not blocking. Both gates were already failing before this
      # repo was split out: mypy reports 112 errors, and ruff reports ~366
      # (mostly UP045 Optional[X] -> X | None, plus B008 against typer's
      # `= typer.Option(...)` idiom, which is a false positive for a CLI).
      # `dev` pins ruff>=0.6 / mypy>=1.10 unbounded, so a fresh install also
      # picks up newer default rules. Clear the backlog, then drop
      # continue-on-error to make these real gates again.
      - name: Lint (ruff) [advisory]
        continue-on-error: true
        run: python -m ruff check src tests

      - name: Type-check (mypy) [advisory]
        continue-on-error: true
        run: python -m mypy src

  frontend:
    name: frontend build + svelte-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Type-check
        run: npm run check
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  # Builds exactly the way the release does, so a packaging break shows up on
  # the pull request instead of on a tag that cannot be re-published.
  build-dist:
    name: build wheel + sdist (with web UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
