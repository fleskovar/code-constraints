name: Build distributions
description: >
  Build the Svelte UI, embed it in the package, then build and validate the
  wheel + sdist. CI and the PyPI release both use this, so the artifact that is
  tested is the artifact that ships.

inputs:
  python-version:
    description: Python version used to build the distributions.
    required: false
    default: "3.12"
  node-version:
    description: Node version used to build the frontend.
    required: false
    default: "20"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    # The wheel serves the web UI from package data. Without these two steps
    # `python -m build` still succeeds, but produces an API-only wheel whose
    # `/` returns a JSON placeholder instead of the app.
    - name: Install frontend dependencies
      run: npm ci
      shell: bash
      working-directory: frontend

    - name: Build the web UI
      run: npm run build
      shell: bash
      working-directory: frontend

    - name: Embed the web UI in the package
      run: make frontend-embed
      shell: bash

    - name: Build wheel + sdist
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        python -m twine check dist/*
      shell: bash

    # A packaging regression here is silent and, once published, permanent:
    # PyPI does not allow re-uploading a version. Fail the build instead.
    - name: Verify the wheel ships the web UI
      run: python .github/scripts/verify_dist.py
      shell: bash
