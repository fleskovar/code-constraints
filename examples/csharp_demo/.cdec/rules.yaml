# Demo rule set for the csharp_demo fixture. Severity is mixed:
# architectural invariants (layering, naming) are `error`, drift signals
# (new/removed classes, fanout) are `warning`. Each rule carries an
# explanatory `message:` that tells the developer WHY the rule exists
# and HOW to address the violation. Messages support `{placeholders}`
# and YAML block scalars (`message: |`).

rules:
  # --- Diff-scope: drift signals ---

  - id: no-new-classes
    type: no-new-classes
    severity: warning
    scope: diff
    message: |
      New class '{qualified_name}' was introduced.
      The csharp_demo fixture is a curated reference; new classes change
      what diagrams and parser tests cover. If this is intentional, run
      `cdec check --update-reference` to bump the snapshot.

  - id: no-removed-classes
    type: no-removed-classes
    severity: warning
    scope: diff
    message: |
      Class '{qualified_name}' was removed. Confirm no other namespace
      still expects it (the parser tests in `tests/test_csharp_parser.py`
      reference this fixture). If deliberate, run
      `cdec check --update-reference`.

  # The `INotifier` contract is part of the public API surface.
  - id: lock-inotifier
    type: frozen-members
    severity: error
    scope: diff
    classes:
      - "Notifications.INotifier"
    kinds: [operation]
    message: |
      The {kind} '{member}' on '{qualified_name}' was {action}.
      INotifier is a public contract — every concrete notifier
      (SmsNotifier, WhatsAppNotifier, and downstream production
      adapters) must keep its signature shape stable. If this change is
      intentional and downstream impls have been updated in lockstep,
      run `cdec check --update-reference` to accept the new baseline.

  # Freeze the architectural-rule tags themselves. This is Engine A
  # (drift) — it compares the tags recorded in reference.xmi against the
  # current model and fires when one is removed or weakened. It never
  # inspects method bodies; that's the separate `cdec enforce` command.
  # Try it: delete `[Sealed]` from `Orders.Receipt` and re-run
  # `cdec check` — this rule will flag the removal.
  - id: freeze-architectural-tags
    type: frozen-rules
    severity: error
    scope: diff
    classes:
      - "Orders.**"
    message: |
      Architectural tag drift: the rule '{rule}' on '{member}' of
      '{qualified_name}' was {action}. These tags encode deliberate
      design constraints (factory-only construction, immutability,
      sealing). Re-add the tag, or — if the constraint is genuinely
      being retired — run `cdec check --update-reference` to accept it.

  # --- Snapshot: architectural invariants ---

  - id: catalog-is-a-leaf-package
    type: forbidden-package-references
    severity: error
    scope: snapshot
    from: ["Catalog"]
    to: ["Orders", "Users", "Notifications"]
    message: |
      Layering violation: '{source}' must not depend on '{target}'.
      `Catalog` describes books and authors — pure domain data. It must
      stay at the bottom of the dependency graph so that any caller can
      use it without dragging in Orders/Users/Notifications. Move the
      offending field/reference to whichever package owns the workflow
      (likely `Orders`).

  - id: notifications-is-a-leaf-package
    type: forbidden-package-references
    severity: error
    scope: snapshot
    from: ["Notifications"]
    to: ["Orders", "Users", "Catalog"]
    message: |
      Layering violation: '{source}' must not depend on '{target}'.
      `Notifications` defines a transport-agnostic INotifier and its
      concrete adapters. Coupling it to domain types (Users, Orders,
      Catalog) defeats the whole point of having a notifier abstraction
      — pass plain strings or DTOs instead.

  - id: users-does-not-depend-on-orders-or-catalog
    type: forbidden-package-references
    severity: error
    scope: snapshot
    from: ["Users"]
    to: ["Orders", "Catalog"]
    message: |
      Layering violation: '{source}' must not depend on '{target}'.
      `Users` may know about `Notifications` (Customer holds an
      INotifier), but it must not know about Orders or Catalog — those
      sit ABOVE Users in the dependency graph. If a user needs to
      participate in an order, model the interaction in `Orders`.

  - id: notifier-implementations-must-end-in-Notifier
    type: subclass-naming
    severity: error
    scope: snapshot
    base: "INotifier"
    name_pattern: ".*Notifier$"
    message: |
      Class '{qualified_name}' implements `{base}` but its name ({name})
      does not match /{pattern}/. Concrete implementations of INotifier
      must end in `Notifier` so the role is obvious at every call site
      (e.g. `SmsNotifier`, `WhatsAppNotifier`, `EmailNotifier`). Rename
      the class or have it implement a different interface.

  - id: catalog-does-not-reference-customer
    type: forbidden-references
    severity: error
    scope: snapshot
    from: ["Catalog.**"]
    to: ["Users.Customer"]
    message: |
      '{source}' references '{target}'. Books and authors must remain
      ignorant of who's buying them — purchase workflows belong in
      Orders/Users. If you need a customer-specific view of the catalog,
      build it in `Orders` (e.g. a `CustomerCatalogView`) rather than
      poisoning Catalog with Users types.

  - id: no-dangling-classes
    type: dangling-classes
    severity: warning
    scope: snapshot
    entry_points:
      - "Users.Admin"
      - "Orders.Order"
      - "Orders.CheckoutService"
      - "Orders.Receipt"
      - "Orders.AuditEntry"
      - "Notifications.SmsNotifier"
      - "Notifications.WhatsAppNotifier"
    message: |
      Class '{qualified_name}' has no incoming references inside this
      project. If application bootstrap (Program.cs / a DI container)
      wires it up, add its qualified name to this rule's `entry_points:`
      list. Otherwise it's dead code — delete it.

  - id: no-cyclic-package-dependencies
    type: no-cyclic-package-dependencies
    severity: error
    scope: snapshot
    message: |
      Cyclic package dependency: {cycle}. Package cycles make modules
      impossible to test or ship independently. Resolve by (a) moving
      shared types into a leaf package both sides can depend on, or
      (b) inverting one direction with an interface (define the
      interface in the lower package, implement in the upper).

  - id: bounded-class-fanout
    type: max-class-fanout
    severity: warning
    scope: snapshot
    limit: 6
    message: |
      Class '{qualified_name}' references {fanout} other classes
      directly (limit: {limit}). High fanout signals a hub: every
      change around it ripples outward. Consider splitting
      responsibilities, introducing a facade, or depending on
      interfaces instead of concrete types.
