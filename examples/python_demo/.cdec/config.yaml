# Demo `cdec check` configuration for the python_demo fixture.
#
# The fixture is the Python port of `examples/csharp_demo` — a small
# e-commerce model: catalog (books + authors), users (User abstract
# base, Admin, Customer), orders (Cart, Order, OrderItem, OrderStatus),
# and notifications (Notification ABC + two concrete notifiers). The
# rules below illustrate every supported rule type.
language: python
source: .
baseline:
  reference: .cdec/reference.xmi
output:
  json: null
  log: null

# Implementation locks (`cdec lock`, Engine C). `Receipt.formatted` /
# `Receipt.Formatted` carries a @locked / [Locked] tag; its approved digest
# lives in .cdec/locks.yaml and `cdec check` verifies it on every run.
lock:
  enabled: true
  include_docstrings: false
  targets: []                    # globs lock elements WITHOUT needing a tag
