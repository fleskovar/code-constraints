# Demo `cdec check` configuration for the odin_demo fixture.
#
# A small e-commerce slice mirroring examples/python_demo: catalog (books +
# authors) at the bottom of the dependency graph, orders (Cart, Receipt,
# ReceiptFactory, CheckoutService, AuditEntry) above it. The rules illustrate
# Engine A (drift + architectural) while `cdec enforce` covers Engine B and
# `cdec lock` covers Engine C.
language: odin
source: .
baseline:
  reference: .cdec/reference.xmi
output:
  json: null
  log: null

# Implementation locks (`cdec lock`, Engine C). Receipt.formatted carries a
# //@cdec locked tag; its approved digest lives in .cdec/locks.yaml and
# `cdec check` verifies it on every run.
lock:
  enabled: true
  include_docstrings: false
  targets: []                    # globs lock elements WITHOUT needing a tag
