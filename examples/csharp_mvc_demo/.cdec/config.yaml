# `cdec check` configuration for the csharp_mvc_demo example.
#
# A minimal in-memory Todo app modelled as classic Model-View-Controller:
#   Model       (layer "model")      — TodoItem, TodoRepository
#   View        (layer "view")       — IView, TodoConsoleView
#   Controller  (layer "controller") — IController, TodoController
#
# The rules in rules.yaml enforce the MVC dependency direction
# (model <- view <- controller) and the *Controller / *View naming convention.
language: csharp
source: .
baseline:
  reference: .cdec/reference.xmi
output:
  json: null
  log: null
